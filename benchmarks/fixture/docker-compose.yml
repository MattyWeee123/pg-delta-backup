# Disposable PostgreSQL 17 cluster for benchmark runs. Synthetic data only.
#
# Sam validated the original PostgreSQL fixture locally. The consolidated
# configuration adds the shared runner and bounded resources. See VALIDATION.md.
#
# Never point this at, or restore into, a cluster holding real data.
#
#   export POSTGRES_PASSWORD='choose-a-throwaway-password'
#   docker compose -f benchmarks/fixture/docker-compose.yml up -d

services:
  postgres:
    image: ${PG_IMAGE:-public.ecr.aws/docker/library/postgres:17}
    cpus: ${POSTGRES_CPUS:-2}
    mem_limit: ${POSTGRES_MEMORY:-2g}
    shm_size: 256mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell}
      # Data checksums are required by benchmarks/README.md step 2 and let
      # verification detect block corruption rather than silently accepting it.
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      # summarize_wal is PostgreSQL 17+ and is a prerequisite for the native
      # incremental baseline this runner will add in v0.2.
      - -c
      - summarize_wal=on
      # pg_basebackup --wal-method=stream opens a second connection, so the
      # fixture explicitly allows enough senders for capture and WAL streaming.
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      # Bound to loopback so the fixture is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  runner:
    profiles: [tools]
    build:
      context: ../..
      dockerfile: benchmarks/Dockerfile
      target: cli
      args:
        PG_IMAGE: ${PG_IMAGE:-public.ecr.aws/docker/library/postgres:17}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell}
      BENCH_IMAGE_DIGEST: ${PG_IMAGE:-unresolved-tag}
      GITHUB_SHA: ${BENCH_COMMIT:-}
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1
    mem_limit: 1g
    volumes:
      - backups:/results
    command: [--host, postgres, --user, postgres, --out, /results]

volumes:
  # Named rather than bind-mounted: a bind mount on a Windows host filesystem
  # would make the measured I/O unrepresentative.
  pgdata:
  backups:
