# Benchmark fixture only. Disposable cluster, synthetic data, loopback-published.
#
# Replication lines are required: pg_basebackup connects to the replication
# pseudo-database, which the default configuration does not allow over TCP.
#
# Connections from the Docker host arrive from the bridge gateway address, not
# 127.0.0.1, which is why the "all" address lines are present. The container
# port is bound to 127.0.0.1 in docker-compose.yml, so this is not exposed
# beyond the host.
#
# Do not copy this file into a cluster that holds real data.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local socket inside the container, used by the healthcheck.
local   all             all                                     trust
local   replication     all                                     trust

# TCP from the Docker host. Password auth so credentials stay in .pgpass.
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
