name: Digest-window sweep (#36 step 2)

# Measures what `--digest-window` buys, on a real PostgreSQL cluster, on demand.
#
# Why this exists: the sweep that should choose pgdelta's shipped `--digest-window` default needs
# PostgreSQL 17 or 18 binaries, which not every contributor's machine has. This runner does.
# It reports numbers and nothing else: it never publishes a run, opens a pull request, or
# changes a default. Reading the table and deciding the default stays a person's job.
#
# Run it from the Actions tab, or: gh workflow run digest-window-sweep.yml -f scale=10

on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'pgbench scale (1 unit is about 15 MB; 10 is ~150 MB and keeps a run short)'
        default: '10'
      change:
        description: 'which rows change on S before the refresh'
        default: 'hot'
        type: choice
        options: [hot, uniform]
      digest_windows:
        description: 'space-separated --digest-window values (bytes) to sweep'
        default: '65536 1048576 8388608 67108864'
      repeats:
        description: 'runs per window. The counters that depend on thread scheduling vary run to run, so each window is reported as a median with its range over these runs'
        default: '3'

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    # One demo run per window per repeat, so this has to cover `digest_windows` x `repeats` of them.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PostgreSQL 17 binaries
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17
          # pgbench ships in the contrib package on some releases and in the server package on
          # others. Install contrib only if the server package did not already provide it.
          if [ ! -x /usr/lib/postgresql/17/bin/pgbench ]; then
            sudo apt-get install -y -qq postgresql-contrib-17
          fi

      - name: Check every binary the demo needs
        run: |
          set -euo pipefail
          PGBIN=/usr/lib/postgresql/17/bin
          missing=''
          for b in initdb pg_ctl psql pgbench pg_basebackup postgres; do
            [ -x "$PGBIN/$b" ] || missing="$missing $b"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing from $PGBIN:$missing"
            echo "Contents of $PGBIN:"; ls -1 "$PGBIN" || true
            exit 1
          fi
          "$PGBIN/postgres" --version

      - name: Sweep
        env:
          # Dispatch inputs are untrusted: pass them through the environment rather than
          # interpolating them into the script, and validate before use.
          SCALE: ${{ inputs.scale }}
          CHANGE: ${{ inputs.change }}
          DIGEST_WINDOWS: ${{ inputs.digest_windows }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          case "$SCALE" in ''|*[!0-9]*) echo "::error::scale must be a whole number"; exit 1;; esac
          case "$REPEATS" in ''|*[!0-9]*) echo "::error::repeats must be a whole number"; exit 1;; esac
          [ "$REPEATS" -ge 1 ] || { echo "::error::repeats must be at least 1"; exit 1; }
          for w in $DIGEST_WINDOWS; do
            case "$w" in ''|*[!0-9]*) echo "::error::--digest-window values must be whole numbers: $w"; exit 1;; esac
            [ "$w" -ge 1 ] || { echo "::error::--digest-window must be at least 1: $w"; exit 1; }
          done

          export PGBIN=/usr/lib/postgresql/17/bin
          export PYTHON=python3
          export LC_ALL=C.UTF-8 LANG=C.UTF-8
          mkdir -p sweep
          # Every window is run REPEATS times: the counters this sweep reports on are a race
          # between the sender's two threads, so one run per window cannot tell a difference
          # between two windows from the spread within one of them.
          for w in $DIGEST_WINDOWS; do
            r=1
            while [ "$r" -le "$REPEATS" ]; do
              echo "::group::--digest-window $w (run $r of $REPEATS)"
              PGDELTA_ARGS="--digest-window $w" SCALE="$SCALE" CHANGE="$CHANGE" \
                bash examples/local_demo.sh "sweep/work-$w-$r"
              cp "sweep/work-$w-$r/pgdelta-stats.json" "sweep/stats-window-$w-run-$r.json"
              rm -rf "sweep/work-$w-$r"
              echo "::endgroup::"
              r=$((r + 1))
            done
          done

      - name: Summarise
        env:
          SCALE: ${{ inputs.scale }}
          CHANGE: ${{ inputs.change }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib, re, statistics
          runs = {}   # the window asked for -> one stats dict per run of it
          for path in pathlib.Path('sweep').glob('stats-window-*.json'):
              named = re.fullmatch(r'stats-window-(\d+)-run-(\d+)', path.stem)
              if named:
                  runs.setdefault(int(named.group(1)), []).append(json.loads(path.read_text()))

          def spread(values, fmt):
              """The median, with the range beside it when the runs disagreed.

              median_low, so every number printed here is a number some run actually produced
              rather than the average of the two middle ones."""
              text = fmt(statistics.median_low(values))
              return text if min(values) == max(values) else f'{text} ({fmt(min(values))}-{fmt(max(values))})'

          whole = lambda v: f'{round(v):,}'
          secs = lambda v: f'{v:.2f}'
          print(f"## Digest-window sweep — pgbench scale {os.environ['SCALE']}, {os.environ['CHANGE']} change\n")
          print('| `--digest-window` asked for | window actually run | runs | Round trips | Digest waits '
                '| Waiting (s) | Elapsed (s) | Sent (bytes) |')
          print('|---:|---:|---:|---:|---:|---:|---:|---:|')
          floored, unknown = [], False
          for window in sorted(runs):
              stats = runs[window]
              # The window each run really used, read from the run's own statistics: the sender
              # floors anything below one BASIS_DIGESTS frame, so the value asked for on the
              # command line is not necessarily the value that was measured.
              effective = sorted({d.get('digest_window') for d in stats}, key=lambda v: (v is None, v))
              if None in effective:
                  unknown = True
                  shown = 'not recorded'
              else:
                  shown = ', '.join(f'{value:,}' for value in effective)
                  if effective != [window]:
                      floored.append(window)
                      shown += ' (floored)'
              counts = [d['counts'] for d in stats]
              print(f'| {window:,} | {shown} | {len(stats)} '
                    f'| {spread([c.get("round_trips", 0) for c in counts], whole)} '
                    f'| {spread([c.get("digest_waits", 0) for c in counts], whole)} '
                    f'| {spread([d["seconds"].get("wait_for_digests", 0.0) for d in stats], secs)} '
                    f'| {spread([d["elapsed_seconds"] for d in stats], secs)} '
                    f'| {spread([d["bytes_sent_total"] for d in stats], whole)} |')
          if not runs:
              print('| no statistics files were found | | | | | | | |')
          print()
          if floored:
              print('**Some rows did not run at the window they were dispatched with.** The sender floors '
                    "`--digest-window` at one `BASIS_DIGESTS` frame, and the \"window actually run\" column "
                    "is read from each run's own statistics rather than from the value asked for. Rows "
                    'marked `(floored)` were measured at the floor; two rows showing the same value in '
                    'that column were measured at the same window, whatever they asked for, so a '
                    'difference between those two is noise and nothing else.')
              print()
          if unknown:
              print('**One or more rows could not report the window they ran at:** their statistics carry '
                    'no `digest_window` field, so they came from a build that did not record it. Do not '
                    'read those rows as measurements of the window named on the left.')
              print()
          if runs:
              print('**Which columns vary on their own.** `copy_runs`, `chunks_same`, `chunks_changed`, '
                    '`chunks_asked` and the bytes sent are decided entirely by what S and B hold: on one '
                    'fixed pair of directories they come out the same every time. Round trips, digest '
                    "waits and the seconds spent waiting do not: they count how often the sender's main "
                    'thread wanted a digest its reader thread had not delivered yet, which is a race '
                    'between two threads, so they differ from run to run on identical input. That is why '
                    'each window is run several times and those columns show a median, with the range in '
                    'brackets whenever the runs disagreed. A gap between two windows that sits inside '
                    "either one's own range is not a result. Each run also rebuilds the cluster from "
                    'scratch, so even the bytes-sent column can move between runs of one window -- '
                    'that spread is the new cluster, not the window.')
              print()
              print('**Round trips are not the interesting column here.** In this streamed engine (#36 step '
                    '2) the sender blocks on the peer only a handful of times regardless of window size -- '
                    'accepting B\'s file list, each digest it has to wait for, and the final result -- so '
                    'round trips no longer tracks `--digest-window` the way it tracked `--batch` in the '
                    'engine before it. What the window actually governs is how often the sender\'s reader '
                    'thread falls behind and the main thread has to stop and wait for a digest that has not '
                    'arrived yet: digest waits, the seconds that costs, and in turn elapsed time and bytes '
                    'sent.')
              print()
              print('**This runner has no slow network.** Digest waits, waiting seconds, elapsed time and '
                    'bytes sent are all measured here, but sender and receiver share a host, so the stall '
                    '`--digest-window` exists to absorb -- a real link\'s round-trip time sitting between '
                    'the two -- is not exercised. Judge `--digest-window` by these columns as a first '
                    'signal, and leave the production-fit claim, and this knob\'s default, to a run with a '
                    'real link between two machines.')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: digest-window-sweep-stats
          path: sweep/stats-window-*.json
          if-no-files-found: error
