name: Digest-window sweep (#36 step 2)

# Measures what `--digest-window` buys, on a real PostgreSQL cluster, on demand.
#
# Why this exists: the sweep that should choose pgdelta's shipped `--digest-window` default needs
# PostgreSQL 17 or 18 binaries, which not every contributor's machine has. This runner does.
# It reports numbers and nothing else: it never publishes a run, opens a pull request, or
# changes a default. Reading the table and deciding the default stays a person's job.
#
# Run it from the Actions tab, or: gh workflow run digest-window-sweep.yml -f scale=10

on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'pgbench scale (1 unit is about 15 MB; 10 is ~150 MB and keeps a run short)'
        default: '10'
      change:
        description: 'which rows change on S before the refresh'
        default: 'hot'
        type: choice
        options: [hot, uniform]
      digest_windows:
        description: 'space-separated --digest-window values (bytes) to sweep'
        default: '65536 1048576 8388608 67108864'

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PostgreSQL 17 binaries
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17
          # pgbench ships in the contrib package on some releases and in the server package on
          # others. Install contrib only if the server package did not already provide it.
          if [ ! -x /usr/lib/postgresql/17/bin/pgbench ]; then
            sudo apt-get install -y -qq postgresql-contrib-17
          fi

      - name: Check every binary the demo needs
        run: |
          set -euo pipefail
          PGBIN=/usr/lib/postgresql/17/bin
          missing=''
          for b in initdb pg_ctl psql pgbench pg_basebackup postgres; do
            [ -x "$PGBIN/$b" ] || missing="$missing $b"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing from $PGBIN:$missing"
            echo "Contents of $PGBIN:"; ls -1 "$PGBIN" || true
            exit 1
          fi
          "$PGBIN/postgres" --version

      - name: Sweep
        env:
          # Dispatch inputs are untrusted: pass them through the environment rather than
          # interpolating them into the script, and validate before use.
          SCALE: ${{ inputs.scale }}
          CHANGE: ${{ inputs.change }}
          DIGEST_WINDOWS: ${{ inputs.digest_windows }}
        run: |
          set -euo pipefail
          case "$SCALE" in ''|*[!0-9]*) echo "::error::scale must be a whole number"; exit 1;; esac
          for w in $DIGEST_WINDOWS; do
            case "$w" in ''|*[!0-9]*) echo "::error::--digest-window values must be whole numbers: $w"; exit 1;; esac
            [ "$w" -ge 1 ] || { echo "::error::--digest-window must be at least 1: $w"; exit 1; }
          done

          export PGBIN=/usr/lib/postgresql/17/bin
          export PYTHON=python3
          export LC_ALL=C.UTF-8 LANG=C.UTF-8
          mkdir -p sweep
          for w in $DIGEST_WINDOWS; do
            echo "::group::--digest-window $w"
            PGDELTA_ARGS="--digest-window $w" SCALE="$SCALE" CHANGE="$CHANGE" \
              bash examples/local_demo.sh "sweep/work-$w"
            cp "sweep/work-$w/pgdelta-stats.json" "sweep/stats-window-$w.json"
            rm -rf "sweep/work-$w"
            echo "::endgroup::"
          done

      - name: Summarise
        env:
          SCALE: ${{ inputs.scale }}
          CHANGE: ${{ inputs.change }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          rows = []
          for p in sorted(pathlib.Path('sweep').glob('stats-window-*.json'),
                          key=lambda q: int(q.stem.rsplit('-', 1)[1])):
              window = int(p.stem.rsplit('-', 1)[1])
              d = json.loads(p.read_text())
              c = d['counts']
              rows.append((window, c.get('round_trips', 0), c.get('digest_waits', 0),
                           d['seconds'].get('wait_for_digests', 0.0), d['elapsed_seconds'], d['bytes_sent_total']))
          print(f"## Digest-window sweep — pgbench scale {os.environ['SCALE']}, {os.environ['CHANGE']} change\n")
          print('| `--digest-window` (bytes) | Round trips | Digest waits | Waiting (s) | Elapsed (s) | Sent (bytes) |')
          print('|---:|---:|---:|---:|---:|---:|')
          for window, trips, waits, waiting, elapsed, sent in rows:
              print(f'| {window:,} | {trips:,} | {waits:,} | {waiting:.2f} | {elapsed:.2f} | {sent:,} |')
          print()
          if rows:
              print('**Round trips are not the interesting column here.** In this streamed engine (#36 step '
                    '2) the sender blocks on the peer only a handful of times regardless of window size -- '
                    'accepting B\'s file list, each digest it has to wait for, and the final result -- so '
                    'round trips no longer tracks `--digest-window` the way it tracked `--batch` in the '
                    'engine before it. What the window actually governs is how often the sender\'s reader '
                    'thread falls behind and the main thread has to stop and wait for a digest that has not '
                    'arrived yet: digest waits, the seconds that costs, and in turn elapsed time and bytes '
                    'sent.')
              print()
              print('**This runner has no slow network.** Digest waits, waiting seconds, elapsed time and '
                    'bytes sent are all measured here, but sender and receiver share a host, so the stall '
                    '`--digest-window` exists to absorb -- a real link\'s round-trip time sitting between '
                    'the two -- is not exercised. Judge `--digest-window` by these columns as a first '
                    'signal, and leave the production-fit claim, and this knob\'s default, to a run with a '
                    'real link between two machines.')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: digest-window-sweep-stats
          path: sweep/stats-window-*.json
          if-no-files-found: error
